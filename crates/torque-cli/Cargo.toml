[package]
name = "torque-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface and management utility for Torque reverse proxy"

[[bin]]
name = "torque"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive", "cargo"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "time"] }
parking_lot.workspace = true
serde_json.workspace = true
bytes.workspace = true
anyhow.workspace = true
torque-core = { workspace = true }
torque-server = { workspace = true }
torque-config = { workspace = true }
torque-proto = { workspace = true }
torque-metrics = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net"] }

[package]
name = "torque-admin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Administrative REST API, health probes, Prometheus exposition, and dashboard server for Torque"

[dependencies]
torque-core = { workspace = true }
torque-proto = { workspace = true }
torque-config = { workspace = true }
torque-metrics = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync"] }
bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net"] }

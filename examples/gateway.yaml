# Torque Production Reverse Proxy & Service Mesh Gateway Configuration
version: "v1alpha1"

server:
  bind_addr: "0.0.0.0:8080"
  worker_threads: 8
  max_connections: 50000
  tcp_nodelay: true
  buffer_size_kb: 64

admin:
  bind_addr: "127.0.0.1:9090"
  enable_dashboard: true
  metrics_path: "/metrics"

clusters:
  # Core API cluster with Peak-EWMA latency-aware load balancing and circuit breaking
  - name: "api-service"
    lb_policy: "peak_ewma"
    endpoints:
      - addr: "127.0.0.1:8081"
        weight: 100
      - addr: "127.0.0.1:8082"
        weight: 100
      - addr: "127.0.0.1:8083"
        weight: 80
    health_check:
      path: "/healthz"
      interval_ms: 2000
      timeout_ms: 500
      healthy_threshold: 2
      unhealthy_threshold: 3
    circuit_breaker:
      failure_rate_threshold: 0.50
      slow_call_rate_threshold: 0.80
      min_request_volume: 20
      window_duration_ms: 10000
      recovery_timeout_ms: 5000
      half_open_probes: 5

  # Authentication cluster with Least Connections policy
  - name: "auth-service"
    lb_policy: "least_conn"
    endpoints:
      - addr: "127.0.0.1:8084"
        weight: 50
      - addr: "127.0.0.1:8085"
        weight: 50
    health_check:
      path: "/healthz"
      interval_ms: 3000
      timeout_ms: 1000
      healthy_threshold: 2
      unhealthy_threshold: 2

  # Analytics and Telemetry cluster with Ketama consistent hashing
  - name: "analytics-service"
    lb_policy: "ketama"
    endpoints:
      - addr: "127.0.0.1:8086"
        weight: 100
      - addr: "127.0.0.1:8087"
        weight: 100

  # Static Assets & CDN origin cluster
  - name: "static-cdn"
    lb_policy: "round_robin"
    endpoints:
      - addr: "127.0.0.1:8088"
        weight: 10

routes:
  # Authenticated user profiles with regex parameter constraints and rate limiting
  - name: "user-profile-route"
    path: "/api/v1/users/{id:[0-9]+}"
    methods: ["GET", "PUT", "PATCH"]
    cluster: "api-service"
    timeout_ms: 2500
    rate_limit:
      rate: 500
      burst: 1000
      key_type: "client_ip"
    cache:
      enabled: true
      ttl_seconds: 60

  # Public API discovery and catalog with Adaptive Replacement Caching
  - name: "public-catalog-route"
    path: "/api/v1/catalog"
    methods: ["GET"]
    cluster: "api-service"
    timeout_ms: 1500
    cache:
      enabled: true
      ttl_seconds: 300

  # Authentication and token issuance endpoint
  - name: "auth-login-route"
    path: "/auth/token"
    methods: ["POST"]
    cluster: "auth-service"
    timeout_ms: 3000
    rate_limit:
      rate: 50
      burst: 100
      key_type: "client_ip"

  # Telemetry ingestion endpoint
  - name: "analytics-ingest-route"
    path: "/analytics/events"
    methods: ["POST"]
    cluster: "analytics-service"
    timeout_ms: 1000

  # Static assets with wildcard fallback
  - name: "static-assets-route"
    path: "/static/*"
    methods: ["GET", "HEAD"]
    cluster: "static-cdn"
    timeout_ms: 5000
    cache:
      enabled: true
      ttl_seconds: 86400

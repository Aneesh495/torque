[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torque-client"
version = "0.1.0"
description = "Official Python control plane SDK and client library for Torque reverse proxy"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "Aneesh Krishna", email = "aneeshkrishnaparthasarathy@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.20"]
